[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qbp-core"
version = "0.1.0"
description = "Quadrachy Binding Protocol — core SDK for binding manifests, QA scoring, correction patches, and control signals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "QBP Contributors" }]
keywords = ["quadrachy", "binding-protocol", "qa", "stability-diffusion", "controlnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lpips>=0.1.4",
    "facenet-pytorch>=2.5",
    "clip-anytorch>=2.6",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/belentani7/qbp-core"
Repository = "https://github.com/belentani7/qbp-core"

[tool.hatch.build.targets.wheel]
packages = ["qbp"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
